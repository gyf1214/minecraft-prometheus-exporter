plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'net.neoforged.moddev' version '2.0.144'
	id 'com.gradleup.shadow' version '9.6.1'
}

group = mod_group_id
version = mod_version

base {
	archivesName = 'Prometheus-Exporter'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
	mavenCentral()
	maven {
		url = 'https://www.shsts.org/m2'
	}
}

sourceSets.main.resources {
	srcDir 'src/generated/resources'
}

neoForge {
	version = project.neo_version

	parchment {
		mappingsVersion = project.parchment_mappings_version
		minecraftVersion = project.parchment_minecraft_version
	}

	runs {
		client {
			client()
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		server {
			server()
			programArgument '--nogui'
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		gameTestServer {
			type = 'gameTestServer'
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		data {
			data()
			programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
		}

		configureEach {
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			logLevel = org.slf4j.event.Level.DEBUG
		}
	}

	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

configurations {
	runtimeClasspath.extendsFrom localRuntime

	compileAndShadow
	implementation.extendsFrom compileAndShadow
	shadow.extendsFrom compileAndShadow
}

dependencies {
	compileAndShadow 'io.prometheus:simpleclient:0.16.0'
	compileAndShadow 'io.prometheus:simpleclient_httpserver:0.16.0'
	compileAndShadow 'io.prometheus:simpleclient_hotspot:0.16.0'

	compileOnly "org.shsts.tinactory:mod:${tinactory_version}"
	localRuntime "org.shsts.tinactory:mod:${tinactory_version}"
}

tasks.withType(ProcessResources).configureEach {
	def replaceProperties = [
		loader_version_range: loader_version_range,
		minecraft_version_range: minecraft_version_range,
		mod_authors: mod_authors,
		mod_description: mod_description,
		mod_id: mod_id,
		mod_license: mod_license,
		mod_logo_file: mod_logo_file,
		mod_name: mod_name,
		mod_tracker_url: mod_tracker_url,
		mod_url: mod_url,
		mod_version: mod_version,
		neo_version_range: neo_version_range,
	]

	inputs.properties replaceProperties

	filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
		expand replaceProperties
	}
}

tasks.named('jar', Jar).configure {
	archiveAppendix = "${minecraft_version}-neoforge"

	manifest {
		attributes([
			'Specification-Title': mod_id,
			'Specification-Vendor': mod_authors,
			'Specification-Version': mod_version,
			'Implementation-Title': mod_name,
			'Implementation-Version': mod_version,
			'Implementation-Vendor': mod_authors,
			'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}

	finalizedBy 'shadowJar'
}

tasks.named('shadowJar').configure {
	archiveAppendix = tasks.jar.archiveAppendix
	archiveClassifier = tasks.jar.archiveClassifier

	enableAutoRelocation = true
	relocationPrefix = "${mod_package}.vendors"
	configurations = [project.configurations.shadow]
	minimize()
}

tasks.shadowJar.dependsOn tasks.jar
tasks.assemble.dependsOn tasks.shadowJar

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}
